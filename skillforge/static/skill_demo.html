<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillForge · 真实技能演示</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18302e;background:#f3f6f4;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{font-weight:800;font-size:24px;letter-spacing:-1px}.badge{font-size:13px;padding:7px 12px;border-radius:20px;background:#e2eee7;color:#275d46}h1{font-size:34px;margin:0 0 12px;letter-spacing:-1px}p{line-height:1.7;color:#546762}.intro{max-width:740px;margin-bottom:28px}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel{background:white;border:1px solid #dbe5df;border-radius:16px;padding:24px;box-shadow:0 4px 18px #14362705}label{display:block;font-weight:650;margin:0 0 12px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cad8d0;border-radius:8px;background:white;margin-bottom:24px}.cases{display:grid;gap:10px;margin-bottom:24px}.case{border:1px solid #dbe5df;border-radius:10px;padding:14px;text-align:left;background:white;color:#253f35;cursor:pointer}.case[aria-pressed=true]{background:#eaf4ee;border:2px solid #37865d;padding:13px}.case small{display:block;font-size:12px;color:#647870;margin-top:5px}.run{width:100%;border:0;border-radius:10px;padding:14px;color:white;background:#205e43;font-weight:650;cursor:pointer}.run:disabled{opacity:.55;cursor:wait}.fine{font-size:12px;line-height:1.7;color:#697b73;margin-top:18px}.status{margin:0 0 14px;font-size:22px}.empty{padding:55px 10px;color:#74857d;text-align:center}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.metric{padding:14px;background:#f3f7f4;border-radius:10px}.metric b{display:block;font-size:25px}.metric span{font-size:12px;color:#637970}.timeline{list-style:none;padding:0}.timeline>li{border-left:2px solid #dce8df;padding:2px 0 18px 18px;margin-left:7px}.step-title{font-weight:650;margin-bottom:6px}.muted{font-size:13px;color:#60776c}.good{color:#24744c}.bad{color:#ab3f29}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;border-radius:8px;padding:12px;font-size:12px;line-height:1.7;max-height:450px;overflow:auto}details{margin:12px 0}summary{cursor:pointer;font-size:14px;color:#345a48}.links{display:flex;gap:18px;font-size:13px;margin-top:20px}a{color:#286446}.receipt{background:#edf6ef;border-radius:10px;padding:14px;margin-top:16px}.error{white-space:pre-wrap;color:#ab3f29}footer{margin-top:24px;font-size:12px;color:#718077}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8fbba5;outline-offset:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}h1{font-size:27px}main{padding:24px 16px}.metrics{gap:6px}.panel{padding:20px}}
.step-title{overflow-wrap:anywhere}
</style></head><body><main>
<header><div class="brand">SkillForge<span style="color:#559473">.</span></div><span class="badge">真实本地模型 · 模拟订单</span></header>
<div class="intro"><h1>让模型真正使用一项技能</h1><p>选择业务场景，观察模型的决定、Skill 内部工具执行和最终验证。每次运行都会创建独立模拟订单，不会修改真实业务数据。</p></div>
<div class="layout"><aside class="panel"><label for="family">业务流程</label><select id="family"><option value="modify_address">修改收货地址</option><option value="cancel_order">取消订单</option><option value="refund">发起退款</option></select>
<label>测试场景</label><div class="cases"><button class="case" data-case="normal" aria-pressed="true">符合办理条件<small>预期：选择 Skill、执行并验证</small></button><button class="case" data-case="shipped" aria-pressed="false"><span id="blocked-name">订单已经发货</span><small>预期：拒绝办理，不进行修改</small></button><button class="case" data-case="high_risk" aria-pressed="false">客户为高风险<small>预期：转人工审核</small></button></div>
<button class="run" id="run">运行真实模型演示</button><div class="fine">模型在动作目录中选择 Skill、读取、拒绝或转人工。“完成”动作需先有验证回执。该演示验证受限流程，不代表开放任务成功率。</div></aside>
<section class="panel" aria-live="polite"><h2 class="status" id="status">等待运行</h2><div id="body" class="empty">运行后，这里会展示完整执行过程。<br>首次加载模型可能需要稍等。</div></section></div>
<footer>Qwen3 4B · Skill Contract + Applicability Gate + 幂等工具 · <a href="/docs">API 文档</a></footer>
</main><script>
const family=document.querySelector('#family'),run=document.querySelector('#run'),status=document.querySelector('#status'),body=document.querySelector('#body');let selected='normal';
const names={get_order:'读取订单',get_customer:'读取客户风险',get_shipment:'读取物流',get_payment:'读取支付',validate_address:'验证地址',update_shipping_address:'更新地址',cancel_order:'取消订单',issue_refund:'执行退款',escalate_to_human:'创建人工工单'};
const outcomes={completed:'已完成',refused:'已拒绝',escalated:'已转人工',error:'执行错误',max_steps_exceeded:'达到步骤上限'};
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function detail(title,data,parent){const d=node('details');d.append(node('summary',title),node('pre',JSON.stringify(data,null,2)));parent.append(d);}
function disable(value){run.disabled=value;family.disabled=value;document.querySelectorAll('.case').forEach(b=>b.disabled=value);}
document.querySelectorAll('.case').forEach(b=>b.onclick=()=>{selected=b.dataset.case;document.querySelectorAll('.case').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
family.onchange=()=>document.querySelector('#blocked-name').textContent=family.value==='refund'?'支付未成功':'订单已经发货';
function render(r){body.className='';body.replaceChildren();status.textContent=(r.demo_passed?'验收通过 · ':'未通过验收 · ')+(outcomes[r.outcome]||r.outcome);status.className='status '+(r.demo_passed?'good':'bad');
const metrics=node('div',undefined,'metrics');for(const [n,v] of [['模型决策',r.metrics.llm_calls],['Skill 调用',r.metrics.skill_calls],['工具调用',r.metrics.tool_calls]]){const m=node('div',undefined,'metric');m.append(node('b',String(v)),node('span',n));metrics.append(m);}body.append(metrics);
const list=node('ol',undefined,'timeline');const gate=node('li');gate.append(node('div','准备：读取业务状态并检查适用边界','step-title'),node('div','Gate 读取 '+r.metrics.gate_tool_calls+' 次，成本计入总调用。','muted'));list.append(gate);
for(const [i,s] of r.steps.entries()){const li=node('li'),a=s.action||{};let title=a.type==='skill'?'模型选择 Skill：'+a.name:a.type==='tool'?'模型选择工具：'+(names[a.name]||a.name):({stop:'模型确认结束',refuse:'模型决定拒绝',escalate:'模型决定转人工'}[a.type]||'模型响应错误');li.append(node('div',(i+1)+'. '+title,'step-title'));
if(s.error)li.append(node('div',s.error,'bad'));if(a.arguments&&Object.keys(a.arguments).length)detail('调用参数',a.arguments,li);
if(a.type==='skill'&&s.result){const inner=node('div');for(const x of s.result.internal_steps||[])inner.append(node('div','✓ '+(names[x.tool]||x.tool),'muted'));li.append(inner);detail('Skill 验证回执',s.result.verification||s.result,li);}list.append(li);}body.append(list);
const receipt=node('div',undefined,'receipt');receipt.append(node('strong','最终状态检查'),node('div','预期结局：'+(r.verification.task_success?'满足':'不满足')+'；违规尝试：'+(r.verification.attempted_policy_violation?'有':'无')+'；实际违规：'+(r.verification.actual_policy_violation?'有':'无'),'muted'));body.append(receipt);
detail('状态变化与验证理由',{changes:r.verification.state_diff,reasons:r.verification.reason},body);detail('模型原始选择与输入',r.model_exchanges,body);detail('完整工具审计（含幂等记录）',r.tool_audit,body);
const links=node('div',undefined,'links'),a=node('a','下载本次完整轨迹');const url=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.href=url;a.download='skillforge-'+r.trajectory_id+'.json';links.append(a);body.append(links);}
async function poll(id){disable(true);status.className='status';status.textContent='真实模型执行中…';body.className='';body.replaceChildren(node('p','正在读取状态、请求模型并执行。可以保留本页等待，刷新后也能继续查看本次任务。'));try{while(true){const res=await fetch('/tasks/'+encodeURIComponent(id));if(!res.ok)throw new Error('任务读取失败：'+res.status);const j=await res.json();if(j.status==='completed'){render(j.result);break;}if(j.status==='failed')throw new Error(j.message||j.error);await new Promise(resolve=>setTimeout(resolve,1000));}}catch(e){status.textContent='执行未完成';body.replaceChildren(node('div',String(e),'error'));}finally{disable(false);}}
run.onclick=async()=>{disable(true);try{const response=await fetch('/skill-demo/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({family:family.value,case:selected})});const j=await response.json();if(!response.ok)throw new Error(JSON.stringify(j));history.replaceState(null,'','?job='+encodeURIComponent(j.task_id));await poll(j.task_id);}catch(e){status.textContent='无法启动任务';body.className='error';body.textContent=String(e);disable(false);}};
const existing=new URLSearchParams(location.search).get('job');if(existing)poll(existing);
</script></body></html>
