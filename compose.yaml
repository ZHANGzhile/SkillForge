services:
  agent-api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SKILLFORGE_MODEL_URL: ${SKILLFORGE_MODEL_URL:-http://host.docker.internal:11434/v1}
      SKILLFORGE_MODEL_NAME: ${SKILLFORGE_MODEL_NAME:-skillforge-qwen3-4b}
      SKILLFORGE_MODEL_CONFIG: configs/model.ollama.json
    volumes:
      - ./results:/app/results
      - ./data:/app/data:ro
